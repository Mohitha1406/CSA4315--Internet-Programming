<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Library Management System</title>
<style>
:root{--navy:#14213d;--blue:#2563eb;--pale:#eff6ff;--bg:#f4f7fb;--ink:#1f2937;--muted:#64748b;--line:#dfe6ef;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:15px Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button:hover{filter:brightness(.94)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e7edf7;color:var(--navy)}.danger{background:#fee2e2;color:var(--red)}.success{background:#dcfce7;color:var(--green)}.small{font-size:12px;padding:7px 9px}
header{background:var(--navy);color:white;padding:17px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:23px;font-weight:800}.brand span{color:#93c5fd}.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 70px)}aside{background:white;border-right:1px solid var(--line);padding:18px 12px}.nav-caption{padding:14px 11px 7px;color:#94a3b8;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px}nav button{display:block;width:100%;text-align:left;background:transparent;color:#475569;margin:2px 0;padding:11px}nav button.active,nav button:hover{background:var(--pale);color:var(--blue)}main{padding:25px;max-width:1500px;width:100%;margin:0 auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:27px;margin:0 0 6px}h2{font-size:19px;margin:0 0 15px}h3{font-size:16px;margin:0 0 9px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.stat,.panel,.book-card{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 3px 12px #0f172a05}.stat label{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;font-size:26px;margin-top:9px}.panel{margin-bottom:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{flex:1;min-width:150px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field{margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{background:#f8fafc;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.pill{display:inline-block;border-radius:25px;background:#dcfce7;color:#166534;padding:5px 9px;font-size:11px;font-weight:bold}.pill.warn{background:#fef3c7;color:#92400e}.pill.off{background:#fee2e2;color:#991b1b}.bookgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.book-card{display:flex;flex-direction:column;gap:7px}.book-art{display:grid;place-items:center;height:85px;background:linear-gradient(135deg,#dbeafe,#f1f5ff);border-radius:9px;font-size:38px}.book-card h3{margin:4px 0 0}.book-card .meta{font-size:12px;color:var(--muted)}.book-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}.notice{background:#eff6ff;color:#1d4ed8;padding:12px;border-radius:8px;font-size:13px;margin-bottom:14px}.empty{text-align:center;padding:25px;color:var(--muted)}.hidden{display:none!important}.auth-wrap{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:20px}.authbox{width:min(450px,100%);background:white;border:1px solid var(--line);border-radius:15px;padding:26px;box-shadow:0 10px 35px #0f172a0d}.authbox h1{margin-bottom:8px}.authbox .field{margin-top:13px}.authbox button.primary{width:100%;margin-top:5px}.link{background:transparent;color:var(--blue);padding:0}.modalback{position:fixed;inset:0;background:#0f172a99;z-index:20;display:grid;place-items:center;padding:15px}.modal{background:white;width:min(600px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:14px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0}.close{background:#e2e8f0;color:#334155;padding:7px 10px}footer{text-align:center;color:#94a3b8;font-size:12px;padding:20px}
@media(max-width:950px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bookgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{padding:7px;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto;gap:3px}nav button{width:auto;white-space:nowrap}.nav-caption{display:none}main{padding:15px}.bookgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}h1{font-size:23px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="brand">📚 Campus<span>Library</span></div>
  <div class="head-actions"><span id="roleLabel">Student Portal</span><button id="roleSwitch" class="secondary">Admin Demo</button><button id="logout" class="hidden">Logout</button></div>
</header>

<section id="authScreen" class="auth-wrap">
  <div class="authbox">
    <h1 id="authTitle">Welcome to Campus Library 👋</h1>
    <p id="authSubtitle" class="muted">Log in or create a student account to continue.</p>
    <div id="registerFields" class="hidden">
      <div class="field"><label>Full name</label><input id="regName" placeholder="Full name"></div>
      <div class="field"><label>Register number</label><input id="regNo" placeholder="Register number"></div>
      <div class="field"><label>Department</label><input id="regDept" placeholder="Department"></div>
    </div>
    <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="student@college.edu" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="authPassword" type="password" placeholder="Password" autocomplete="current-password"></div>
    <button id="authSubmit" class="primary">Login</button>
    <p style="text-align:center;margin-top:15px" class="muted"><span id="togglePrompt">New student?</span> <button id="authToggle" class="link">Register here</button></p>
    <p class="muted" style="margin-top:14px">Demo only: admin mode is not secured. Browser storage is local to this device.</p>
  </div>
</section>

<div id="app" class="shell hidden">
  <aside>
    <div class="nav-caption">Library</div><nav id="mainNav"></nav>
    <div class="nav-caption">Account</div><nav id="accountNav"></nav>
  </aside>
  <main>
    <div class="pagehead"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle" class="muted"></p></div><button id="quickAdd">＋ Add Book</button></div>
    <div id="content"></div><footer>CampusLibrary · Library Management System</footer>
  </main>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const get=(key,def)=>{try{const x=localStorage.getItem(key);return x===null?def:JSON.parse(x)}catch(e){return def}};
const put=(key,val)=>localStorage.setItem(key,JSON.stringify(val));
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const plusDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dateDiff=(a,b)=>Math.max(0,Math.ceil((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000));
const initialBooks=[
{id:101,title:"Introduction to Algorithms",author:"Thomas H. Cormen",category:"Computer Science",year:2022,isbn:"9780262046305",total:5,available:3},
{id:102,title:"Artificial Intelligence: A Modern Approach",author:"Stuart Russell",category:"Artificial Intelligence",year:2021,isbn:"9780134610993",total:4,available:2},
{id:103,title:"Database System Concepts",author:"Abraham Silberschatz",category:"Database",year:2020,isbn:"9780078022159",total:6,available:5},
{id:104,title:"Operating System Concepts",author:"Abraham Silberschatz",category:"Computer Science",year:2019,isbn:"9781119800361",total:3,available:1},
{id:105,title:"Deep Learning",author:"Ian Goodfellow",category:"Artificial Intelligence",year:2018,isbn:"9780262035613",total:4,available:4},
{id:106,title:"Python Crash Course",author:"Eric Matthes",category:"Programming",year:2023,isbn:"9781718502703",total:5,available:4}
];
let books=get("cl_books",initialBooks),users=get("cl_users",[]),loans=get("cl_loans",[]),materials=get("cl_materials",[
{id:1,title:"Data Structures — Unit Notes",subject:"Data Structures",year:"2",semester:"1",url:""},
{id:2,title:"Machine Learning — Revision Guide",subject:"Machine Learning",year:"3",semester:"1",url:""},
{id:3,title:"Mathematics — Formula Sheet",subject:"Engineering Mathematics",year:"1",semester:"2",url:""}
]),messages=get("cl_messages",[]);
let currentUser=get("cl_currentUser",null),isAdmin=false,authMode="login",page="dashboard";
function persist(){put("cl_books",books);put("cl_users",users);put("cl_loans",loans);put("cl_materials",materials);put("cl_messages",messages);put("cl_currentUser",currentUser)}
function myLoans(){return loans.filter(l=>l.userEmail===currentUser?.email)}
function bookById(id){return books.find(b=>b.id===Number(id))}
function bookTitle(id){return bookById(id)?.title||"Deleted book"}
function fine(l){if(l.paid)return 0;const end=l.returned?(l.returnDate||today()):today();return dateDiff(l.due,end)*10}
function navItems(){return isAdmin?[["dashboard","📊 Dashboard"],["books","📚 Manage Books"],["issue","📤 Issue / Return"],["fines","💰 Manage Fines"],["materials","📁 Study Materials"],["users","👥 Student Accounts"],["messages","✉️ Messages"]]:[["dashboard","🏠 Dashboard"],["books","🔎 Search Books"],["history","📖 Borrow History"],["fines","💰 Check Fine"],["materials","📁 Study Materials"]]}
function renderNav(){
 $("mainNav").innerHTML=navItems().map(([id,label])=>`<button data-page="${id}" class="${page===id?"active":""}">${label}</button>`).join("");
 $("accountNav").innerHTML=`<button data-page="profile" class="${page==="profile"?"active":""}">👤 My Profile</button><button data-page="contact" class="${page==="contact"?"active":""}">✉️ Contact Library</button>`;
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
}
function go(p){page=p;renderNav();renderPage()}
function stat(label,value,emoji){return `<div class="stat"><label>${emoji} ${label}</label><strong>${value}</strong></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records found.</td></tr>`}</tbody></table></div>`}
function bookCard(b){return `<div class="book-card"><div class="book-art">📘</div><h3>${esc(b.title)}</h3><div class="meta">by ${esc(b.author)}</div><div class="meta">${esc(b.category)} · ${b.year} · ISBN ${esc(b.isbn||"—")}</div><div class="book-foot"><span class="pill ${b.available===0?"off":""}">${b.available} available</span>${isAdmin?`<button class="small secondary" data-edit="${b.id}">Edit</button>`:`<button class="small" data-request="${b.id}" ${b.available<1?"disabled":""}>Request issue</button>`}</div></div>`}
function dashboard(){
 if(isAdmin){let active=loans.filter(l=>!l.returned),over=active.filter(l=>l.due<today());return `<div class="stats">${stat("Book titles",books.length,"📚")}${stat("Available copies",books.reduce((s,b)=>s+b.available,0),"✅")}${stat("Books on loan",active.length,"📖")}${stat("Overdue loans",over.length,"⏰")}</div><div class="panel"><h2>Recent borrowing</h2>${table(["Student","Book","Issue Date","Due Date","Status"],loans.slice().reverse().slice(0,8).map(l=>`<tr><td>${esc(l.userName)}<br><span class="muted">${esc(l.userEmail)}</span></td><td>${esc(bookTitle(l.bookId))}</td><td>${esc(l.issue)}</td><td>${esc(l.due)}</td><td><span class="pill ${l.returned?"":l.due<today()?"warn":""}">${l.returned?"Returned":l.due<today()?"Overdue":"Issued"}</span></td></tr>`).join(""))}</div>`}
 return `<div class="stats">${stat("Book titles",books.length,"📚")}${stat("My active loans",myLoans().filter(l=>!l.returned).length,"📖")}${stat("Available copies",books.reduce((s,b)=>s+b.available,0),"✅")}${stat("Unpaid fine","₹"+myLoans().reduce((s,l)=>s+fine(l),0),"💰")}</div><div class="panel"><h2>Explore the catalogue</h2><div class="bookgrid">${books.slice(0,3).map(bookCard).join("")}</div><p class="muted" style="margin-top:14px">Books can be requested from Search Books. The librarian must issue books through the admin dashboard in a real workflow.</p></div>`;
}
function booksPage(){return `<div class="panel"><div class="toolbar"><input id="bookSearch" placeholder="Search title, author, category or ISBN…"><select id="bookCategory"><option value="">All categories</option>${[...new Set(books.map(b=>b.category))].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div><div id="bookResults" class="bookgrid">${books.map(bookCard).join("")}</div></div>`}
function issuePage(){return `<div class="panel"><h2>Issue a book to a student</h2><div class="formgrid"><div class="field"><label>Student email</label><input id="issueEmail" type="email" placeholder="Registered student email"></div><div class="field"><label>Book</label><select id="issueBook">${books.map(b=>`<option value="${b.id}" ${b.available<1?"disabled":""}>${esc(b.title)} (${b.available} available)</option>`).join("")}</select></div><div class="field"><label>Issue date</label><input id="issueDate" type="date" value="${today()}"></div><div class="field"><label>Expected return date</label><input id="issueDue" type="date" value="${plusDays(14)}"></div></div><button id="issueSubmit">Issue Book</button></div><div class="panel"><h2>Issued / overdue books</h2>${table(["Student","Book","Issue Date","Due Date","Fine today","Action"],loans.filter(l=>!l.returned).map(l=>`<tr><td>${esc(l.userName)}<br>${esc(l.userEmail)}</td><td>${esc(bookTitle(l.bookId))}</td><td>${esc(l.issue)}</td><td>${esc(l.due)}</td><td>₹${fine(l)}</td><td><button class="small" data-return="${l.id}">Mark returned</button></td></tr>`).join(""))}</div>`}
function historyPage(){return `<div class="panel"><div class="notice">Late fine rule for this demo: ₹10 per day after the expected return date. Adjust this rate to match your library policy.</div>${table(["Book","Issue Date","Expected Return","Actual Return","Status","Fine"],myLoans().slice().reverse().map(l=>`<tr><td>${esc(bookTitle(l.bookId))}</td><td>${esc(l.issue)}</td><td>${esc(l.due)}</td><td>${esc(l.returnDate||"—")}</td><td><span class="pill ${l.returned?"":l.due<today()?"warn":""}">${l.returned?"Returned":l.due<today()?"Overdue":"Issued"}</span></td><td>₹${fine(l)}</td></tr>`).join(""))}</div>`}
function finesPage(){let list=isAdmin?loans:myLoans();return `<div class="stats">${stat("Outstanding fine","₹"+list.reduce((s,l)=>s+fine(l),0),"💰")}${stat("Overdue loans",list.filter(l=>!l.returned&&l.due<today()).length,"⏰")}</div><div class="panel">${table(["Student","Book","Due Date","Returned","Fine","Payment","Action"],list.map(l=>`<tr><td>${esc(l.userName)}<br>${esc(l.userEmail)}</td><td>${esc(bookTitle(l.bookId))}</td><td>${esc(l.due)}</td><td>${esc(l.returnDate||"—")}</td><td>₹${fine(l)}</td><td><span class="pill ${l.paid?"":"warn"}">${l.paid?"Paid":fine(l)>0?"Pending":"No fine"}</span></td><td>${isAdmin&&fine(l)>0&&!l.paid?`<button class="small" data-paid="${l.id}">Mark paid</button>`:"—"}</td></tr>`).join(""))}</div>`}
function materialRows(arr){return table(["Material","Subject","Year","Semester","File"],arr.map(m=>`<tr><td>${esc(m.title)}</td><td>${esc(m.subject)}</td><td>${esc(m.year)}</td><td>${esc(m.semester)}</td><td>${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">Open / Download</a>`:"No file attached"} ${isAdmin?`<button class="small danger" data-del-material="${m.id}">Delete</button>`:""}</td></tr>`).join(""))}
function materialsPage(){return `<div class="panel"><div class="toolbar"><input id="matSearch" placeholder="Search material or subject"><select id="matYear"><option value="">All years</option>${[1,2,3,4].map(x=>`<option value="${x}">Year ${x}</option>`).join("")}</select><select id="matSem"><option value="">All semesters</option>${[1,2,3,4,5,6,7,8].map(x=>`<option value="${x}">Semester ${x}</option>`).join("")}</select></div><div id="matResults">${materialRows(materials)}</div><p class="muted" style="margin-top:12px">For downloads, the admin should enter a valid direct file URL or link to the material.</p></div>`}
function profilePage(){return `<div class="panel"><h2>My Profile</h2><div class="formgrid"><div class="field"><label>Full name</label><input id="pName" value="${esc(currentUser?.name||"")}"></div><div class="field"><label>Email (account ID)</label><input value="${esc(currentUser?.email||"")}" disabled></div><div class="field"><label>Register number</label><input id="pReg" value="${esc(currentUser?.reg||"")}"></div><div class="field"><label>Department</label><input id="pDept" value="${esc(currentUser?.dept||"")}"></div></div><button id="saveProfile">Save Profile</button></div>`}
function contactPage(){return `<div class="panel"><h2>Contact the Library</h2><div class="field"><label>Your email</label><input id="cEmail" type="email" value="${esc(currentUser?.email||"")}"></div><div class="field"><label>Subject</label><input id="cSubject" placeholder="Book availability, fine, materials…"></div><div class="field"><label>Message</label><textarea id="cMessage" rows="5" placeholder="Write your message"></textarea></div><button id="sendMessage">Send Message</button><p class="muted" style="margin-top:12px">Messages are saved in this browser demo; no email is sent.</p></div>`}
function usersPage(){return `<div class="panel"><h2>Registered students</h2>${table(["Name","Register Number","Email","Department"],users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.reg||"—")}</td><td>${esc(u.email)}</td><td>${esc(u.dept||"—")}</td></tr>`).join(""))}</div>`}
function messagesPage(){return `<div class="panel"><h2>Contact messages</h2>${table(["Date","From","Subject","Message"],messages.slice().reverse().map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.email)}</td><td>${esc(m.subject)}</td><td>${esc(m.message)}</td></tr>`).join(""))}</div>`}
const pageInfo={dashboard:["Dashboard","Your library overview."],books:["Book Catalogue","Search available books or manage the collection."],issue:["Issue / Return Books","Manage circulation and return status."],history:["My Borrow History","Review issue dates, due dates, returns, and fines."],fines:["Fine Management","View outstanding fines and record payments."],materials:["Study Materials","Filter course materials by year and semester."],users:["Student Accounts","View registered student information."],messages:["Contact Messages","Messages submitted using the contact form."],profile:["My Profile","Update your student details."],contact:["Contact Library","Send a message to the library team."]};
function renderPage(){
 $("pageTitle").textContent=pageInfo[page]?.[0]||"Library";$("pageSubtitle").textContent=pageInfo[page]?.[1]||"";
 $("quickAdd").classList.toggle("hidden",!(isAdmin&&["dashboard","books","materials"].includes(page)));
 $("quickAdd").textContent=page==="materials"?"＋ Add Material":"＋ Add Book";
 const renderers={dashboard,books:booksPage,issue:issuePage,history:historyPage,fines:finesPage,materials:materialsPage,users:usersPage,messages:messagesPage,profile:profilePage,contact:contactPage};
 $("content").innerHTML=(renderers[page]||dashboard)();wirePage();
}
function enterApp(admin=false){isAdmin=admin;$("authScreen").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.toggle("hidden",!currentUser);$("roleLabel").textContent=admin?"Librarian Admin":"Student Portal";$("roleSwitch").textContent=admin?"Switch to Student":"Admin Demo";page="dashboard";renderNav();renderPage()}
function showAuth(){ $("app").classList.add("hidden");$("authScreen").classList.remove("hidden");$("logout").classList.add("hidden")}
function wirePage(){
 $("quickAdd").onclick=()=>page==="materials"?openMaterialModal():openBookModal();
 document.querySelectorAll("[data-request]").forEach(b=>b.onclick=()=>requestBook(Number(b.dataset.request)));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openBookModal(Number(b.dataset.edit)));
 document.querySelectorAll("[data-return]").forEach(b=>b.onclick=()=>returnBook(Number(b.dataset.return)));
 document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>{let l=loans.find(x=>x.id===Number(b.dataset.paid));if(l){l.paid=true;persist();renderPage()}});
 document.querySelectorAll("[data-del-material]").forEach(b=>b.onclick=()=>{if(confirm("Delete this material record?")){materials=materials.filter(m=>m.id!==Number(b.dataset.delMaterial));persist();renderPage()}});
 if($("bookSearch")){const filter=()=>{let q=$("bookSearch").value.toLowerCase(),c=$("bookCategory").value;let list=books.filter(b=>(`${b.title} ${b.author} ${b.category} ${b.isbn}`.toLowerCase().includes(q))&&(!c||b.category===c));$("bookResults").innerHTML=list.map(bookCard).join("")||`<div class="empty">No books match your search.</div>`;wirePage()};$("bookSearch").oninput=filter;$("bookCategory").onchange=filter}
 if($("issueSubmit"))$("issueSubmit").onclick=issueBook;
 if($("matSearch")){const filter=()=>{let q=$("matSearch").value.toLowerCase(),y=$("matYear").value,s=$("matSem").value;let list=materials.filter(m=>(`${m.title} ${m.subject}`.toLowerCase().includes(q))&&(!y||m.year===y)&&(!s||m.semester===s));$("matResults").innerHTML=materialRows(list);wireMaterialDelete()};$("matSearch").oninput=filter;$("matYear").onchange=filter;$("matSem").onchange=filter}
 if($("saveProfile"))$("saveProfile").onclick=()=>{currentUser={...currentUser,name:$("pName").value.trim(),reg:$("pReg").value.trim(),dept:$("pDept").value.trim()};users=users.map(u=>u.email===currentUser.email?{...u,...currentUser}:u);persist();alert("Profile saved.");renderPage()};
 if($("sendMessage"))$("sendMessage").onclick=()=>{let email=$("cEmail").value.trim(),subject=$("cSubject").value.trim(),message=$("cMessage").value.trim();if(!email||!subject||!message)return alert("Please fill in all fields.");messages.push({id:Date.now(),date:today(),email,subject,message});persist();alert("Message saved.");renderPage()};
}
function wireMaterialDelete(){document.querySelectorAll("[data-del-material]").forEach(b=>b.onclick=()=>{if(confirm("Delete this material record?")){materials=materials.filter(m=>m.id!==Number(b.dataset.delMaterial));persist();renderPage()}})}
function requestBook(id){const b=bookById(id);if(!b||b.available<1)return alert("No copies are currently available.");if(myLoans().some(l=>l.bookId===id&&!l.returned))return alert("You already have this book issued.");alert("Please contact the librarian to complete the issue. The student request is not treated as an issued book.");}
function issueBook(){const email=$("issueEmail").value.trim().toLowerCase(),book=bookById($("issueBook").value),issue=$("issueDate").value,due=$("issueDue").value;const u=users.find(x=>x.email.toLowerCase()===email);if(!u)return alert("No registered student has this email. Ask the student to register first.");if(!book||book.available<1)return alert("This book is not available.");if(!issue||!due||due<issue)return alert("Choose a valid issue date and due date.");if(loans.some(l=>l.userEmail===email&&l.bookId===book.id&&!l.returned))return alert("This student already has this book issued.");loans.push({id:Date.now(),bookId:book.id,userEmail:email,userName:u.name,issue,due,returned:false,returnDate:null,paid:false});book.available--;persist();renderPage();alert("Book issued successfully.")}
function returnBook(id){const l=loans.find(x=>x.id===id);if(!l||l.returned)return;if(!confirm("Mark this book as returned today?"))return;l.returned=true;l.returnDate=today();const b=bookById(l.bookId);if(b)b.available=Math.min(b.total,b.available+1);persist();renderPage();alert("Return recorded. Fine due: ₹"+fine(l))}
function openBookModal(id){let b=id?bookById(id):{title:"",author:"",category:"",year:new Date().getFullYear(),isbn:"",total:1,available:1};if(!b)return;$("modalRoot").innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>${id?"Update Book":"Add Book"}</h2><button class="close" id="modalClose">✕</button></div><div class="formgrid"><div class="field wide"><label>Book title</label><input id="fTitle" value="${esc(b.title)}"></div><div class="field"><label>Author</label><input id="fAuthor" value="${esc(b.author)}"></div><div class="field"><label>Category</label><input id="fCategory" value="${esc(b.category)}"></div><div class="field"><label>Publication year</label><input id="fYear" type="number" value="${b.year}"></div><div class="field"><label>ISBN</label><input id="fIsbn" value="${esc(b.isbn)}"></div><div class="field"><label>Total copies</label><input id="fTotal" type="number" min="1" value="${b.total}"></div><div class="field"><label>Available copies</label><input id="fAvailable" type="number" min="0" value="${b.available}"></div></div><div style="display:flex;gap:8px;justify-content:flex-end">${id?'<button class="danger" id="deleteBook">Delete</button>':""}<button id="saveBook">Save Book</button></div></div></div>`;
 $("modalClose").onclick=()=>$("modalRoot").innerHTML="";
 $("saveBook").onclick=()=>{const title=$("fTitle").value.trim(),author=$("fAuthor").value.trim(),total=Number($("fTotal").value),available=Number($("fAvailable").value);if(!title||!author||!Number.isInteger(total)||total<1||!Number.isInteger(available)||available<0||available>total)return alert("Enter valid book details and copy counts.");if(id&&available>total)return alert("Available copies cannot exceed total copies.");const item={id:id||Date.now(),title,author,category:$("fCategory").value.trim()||"General",year:Number($("fYear").value)||new Date().getFullYear(),isbn:$("fIsbn").value.trim(),total,available};if(id)books=books.map(x=>x.id===id?item:x);else books.push(item);persist();$("modalRoot").innerHTML="";renderPage()};
 if(id)$("deleteBook").onclick=()=>{if(loans.some(l=>l.bookId===id&&!l.returned))return alert("Return all issued copies before deleting this book.");if(confirm("Delete this book?")){books=books.filter(x=>x.id!==id);persist();$("modalRoot").innerHTML="";renderPage()}};
}
function openMaterialModal(){$("modalRoot").innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>Add Study Material</h2><button class="close" id="modalClose">✕</button></div><div class="field"><label>Material title</label><input id="mTitle" placeholder="Unit notes / revision guide"></div><div class="field"><label>Subject</label><input id="mSubject" placeholder="Subject name"></div><div class="formgrid"><div class="field"><label>Year</label><select id="mYear">${[1,2,3,4].map(x=>`<option value="${x}">Year ${x}</option>`).join("")}</select></div><div class="field"><label>Semester</label><select id="mSemester">${[1,2,3,4,5,6,7,8].map(x=>`<option value="${x}">Semester ${x}</option>`).join("")}</select></div></div><div class="field"><label>File URL (optional)</label><input id="mUrl" type="url" placeholder="https://…"></div><button id="saveMaterial">Save Material</button></div></div>`;$("modalClose").onclick=()=>$("modalRoot").innerHTML="";$("saveMaterial").onclick=()=>{const title=$("mTitle").value.trim(),subject=$("mSubject").value.trim(),url=$("mUrl").value.trim();if(!title||!subject)return alert("Enter the title and subject.");if(url&&!/^https?:\/\//i.test(url))return alert("Use a valid http or https URL.");materials.push({id:Date.now(),title,subject,year:$("mYear").value,semester:$("mSemester").value,url});persist();$("modalRoot").innerHTML="";renderPage()}}
$("authToggle").onclick=()=>{authMode=authMode==="login"?"register":"login";$("registerFields").classList.toggle("hidden",authMode!=="register");$("authTitle").textContent=authMode==="login"?"Welcome to Campus Library 👋":"Create Student Account";$("authSubtitle").textContent=authMode==="login"?"Log in to access the library.":"Register to manage your library activity."; $("authSubmit").textContent=authMode==="login"?"Login":"Register";$("togglePrompt").textContent=authMode==="login"?"New student?":"Already registered?";$("authToggle").textContent=authMode==="login"?"Register here":"Login"};
$("authSubmit").onclick=()=>{const email=$("authEmail").value.trim().toLowerCase(),password=$("authPassword").value;if(!email||!password)return alert("Enter email and password.");if(authMode==="register"){const name=$("regName").value.trim();if(!name)return alert("Enter your full name.");if(users.some(u=>u.email.toLowerCase()===email))return alert("An account with this email already exists.");currentUser={id:Date.now(),name,reg:$("regNo").value.trim(),dept:$("regDept").value.trim(),email,password};users.push(currentUser);persist();enterApp(false)}else{const user=users.find(u=>u.email.toLowerCase()===email);if(!user)return alert("Account not found. Please register first.");if(user.password!==password)return alert("Incorrect password.");currentUser=user;persist();enterApp(false)}};
$("roleSwitch").onclick=()=>{if(!currentUser){if(confirm("Admin demo is not secured. Continue as demo librarian?"))enterApp(true);return}if(!isAdmin){if(confirm("Switch to librarian admin demo? This is not secure role-based authentication."))enterApp(true)}else enterApp(false)};
$("logout").onclick=()=>{currentUser=null;persist();showAuth()};
if(currentUser){enterApp(false)}else{showAuth()}
</script>
</body>
</html>
